<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#0077b6;
            margin-bottom:25px;
        }

        input{
            width:90%;
            padding:12px;
            margin:8px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            border:2px solid #0077b6;
            outline:none;
        }

        button{
            width:95%;
            padding:12px;
            margin-top:15px;
            border:none;
            background:#0077b6;
            color:white;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#023e8a;
        }

        h2{
            color:green;
            margin-top:20px;
        }

        p{
            color:#555;
        }

    </style>

</head>

<body>

<div class="container">

<h1>🩺 Diabetes Prediction System</h1>

<p>Enter patient details below</p>

<form action="/predict" method="POST">

<input type="number" step="any" name="Pregnancies" placeholder="Pregnancies" required>

<input type="number" step="any" name="Glucose" placeholder="Glucose Level" required>

<input type="number" step="any" name="BloodPressure" placeholder="Blood Pressure" required>

<input type="number" step="any" name="SkinThickness" placeholder="Skin Thickness" required>

<input type="number" step="any" name="Insulin" placeholder="Insulin Level" required>

<input type="number" step="any" name="BMI" placeholder="BMI" required>

<input type="number" step="any" name="DiabetesPedigreeFunction" placeholder="Diabetes Pedigree Function" required>

<input type="number" step="any" name="Age" placeholder="Age" required>

<button type="submit">Predict</button>

</form>

<h2>{{ prediction_text }}</h2>

</div>

</body>
</html>
